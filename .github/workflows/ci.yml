name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - name: Lint foundation modules
        run: >
          npx eslint
          src/lib/contracts
          src/lib/api
          src/lib/creation-flow
          src/lib/validations.ts
          src/components/ImagePickerControl.tsx
          src/components/FastPathWizard.tsx
          src/components/SlideEditor.tsx
          src/components/CarouselCreator.tsx
          src/components/WizardSummaryBar.tsx
      - run: npm run typecheck
      - run: npm test
